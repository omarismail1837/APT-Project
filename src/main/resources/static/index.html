<!DOCTYPE html>
<html>
<head>
    <title>CRDT WebSocket Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        #log { background: #f4f4f4; padding: 10px; border-radius: 5px; height: 200px; overflow-y: scroll; border: 1px solid #ccc; }
        .status-on { color: green; font-weight: bold; }
        .status-off { color: red; font-weight: bold; }
    </style>
</head>
<body>

<h2>CRDT Action Tester</h2>
<div>
    Status: <span id="status" class="status-off">Disconnected</span>
</div>
<br>

<button onclick="connect()">1. Connect to Server</button>
<button onclick="sendAction()" id="sendBtn" disabled>2. Send Test Action</button>

<h3>Activity Log:</h3>
<div id="log"></div>

<script>
    let stompClient = null;

    function log(message) {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${message}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function connect() {
        // This matches your registry.addEndpoint("/ws-connect")
        const socket = new SockJS('/ws-connect');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
            document.getElementById('status').innerText = "Connected!";
            document.getElementById('status').className = "status-on";
            document.getElementById('sendBtn').disabled = false;
            log("Connected to STOMP");

            // Subscribe to the topic you defined in @SendTo
            stompClient.subscribe('/topic/updates', function (response) {
                const action = JSON.parse(response.body);
                log(`<b>RECV FROM SERVER:</b> Type: ${action.actionType}, Data: ${action.extraData}`);
            });
        }, function (error) {
            log("Error: " + error);
        });
    }

    function sendAction() {
        // Create the object matching your Java Action class
        const actionObject = {
            actionType: "INSERT",
            startCharID: "user1-node10",
            endCharID: "user1-node11",
            extraData: "Hello World!"
        };

        log(`<b>SENDING:</b> ${actionObject.actionType}`);

        // Send to the @MessageMapping("/send-data")
        // Prefixed by /app as per your config
        stompClient.send("/app/send-data", {}, JSON.stringify(actionObject));
    }
</script>
</body>
</html>
